<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Solicitud de Condonación</title>
  </head>

  <body class="bg-light">
    <div class="container mt-4 mb-5">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Solicitud de Condonación</h4>
        </div>

        <div class="card-body">
          <form id="frmCondonacion">
            <!-- Sección: Datos Generales y Registro -->
            <div class="row">
              <div class="col-md-4 mb-3">
                <label>Fecha de Registro</label>
                <input type="text" id="fechaHora" name="fechaHora" class="form-control" readonly />
              </div>

              <div class="col-md-4 mb-3">
                <label for="telefonoEjecutivo" class="form-label">Teléfono del Ejecutivo</label>
                <input type="tel" id="telefonoEjecutivo" name="telefonoEjecutivo" class="form-control" placeholder="Ej. 5512345678" />
              </div>

              <div class="col-md-4 mb-3">
                <label for="nombreCliente" class="form-label">Nombre del Cliente</label>
                <input type="text" id="nombreCliente" name="nombreCliente" class="form-control" required />
              </div>
            </div>

            <!-- Sección: Datos del Crédito y Condonación -->
            <div class="row">
              <div class="col-md-3 mb-3">
                <label for="credito" class="form-label">No. de Crédito</label>
                <input type="text" id="credito" name="credito" class="form-control" required />
              </div>

              <div class="col-md-3 mb-3">
                <label for="producto" class="form-label">Producto</label>
                <select name="producto" id="producto" class="form-select" required>
                   <option value="">Seleccione</option>
                  <option value="C-MOVIL">C-MOVIL</option>
                  <option value="C-FACIL">C-FACIL</option>
                  <option value="C-ESPCIAL">C-ESPECIAL</option>
                  <option value="C-EMPRENDEDOR">C-EMPRENDEDOR</option>
                  <option value="C-COSECHA">C-COSECHA</option>
                  <option value="C-AUTO">C-AUTO</option>
                  <option value="C-DISTRIBUIDOR">C-DISTRIBUIDOR</option>
                  <option value="CREDICONTADO">CREDICONTADO</option>
                  <option value="C-LIQUIDEZ">C-LIQUIDEZ</option>
                  <option value="C-PREFERENTE">C-PREFERENTE</option>
                </select>
              </div>

              <div class="col-md-3 mb-3">
                <label for="diasAtraso" class="form-label">Días de Atraso</label>
                <input type="number" id="diasAtraso" name="diasAtraso" class="form-control" min="0" />
              </div>

              <div class="col-md-3 mb-3">
                <label for="importe" class="form-label">Importe</label>
                <input type="number" step="0.01" id="importe" name="importe" class="form-control" placeholder="0.00" required />
              </div>
            </div>

            <!-- Sección: Comprobante y Convenio -->
            <div class="row">
              <div class="col-md-4 mb-3">
                <label for="fechaDeposito" class="form-label">Fecha de Depósito</label>
                <input type="date" id="fechaDeposito" name="fechaDeposito" class="form-control" />
              </div>

              <div class="col-md-4 mb-3">
                <label for="fichaDeposito" class="form-label">Ficha de Depósito</label>
                <input type="file" id="fichaDeposito" name="fichaDeposito" class="form-control" accept=".pdf,.jpg,.jpeg,.png" />
              </div>

              <div class="col-md-4 mb-3">
                <label for="convenio" class="form-label">Convenio</label>
                <input type="file" id="convenio" name="convenio" class="form-control" accept=".pdf,.jpg,.jpeg,.png" />
              </div>
            </div>

            <!-- Sección: Datos del Ejecutivo -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="nombreEjecutivo" class="form-label">Nombre del Ejecutivo</label>
                <input type="text" id="nombreEjecutivo" name="nombreEjecutivo" class="form-control" required />
              </div>

              <div class="col-md-6 mb-3">
                <label for="correoEjecutivo" class="form-label">Correo del Ejecutivo</label>
                <input type="email" id="correoEjecutivo" name="correoEjecutivo" class="form-control" placeholder="ejemplo@correo.com" required />
              </div>
            </div>

            <!-- Sección: Comentarios -->
            <div class="mb-3">
              <label for="comentario" class="form-label">Comentario / Justificación</label>
              <textarea id="comentario" name="comentario" rows="4" class="form-control" placeholder="Escriba aquí los detalles o motivos de la condonación..."></textarea>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-md-end">
              <button type="submit" class="btn btn-success px-4">Enviar Solicitud</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
