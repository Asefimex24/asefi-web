<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Registro de Liquidación</title>
    <style>
      #btnEnvio:disabled {
        cursor: not-allowed;
        opacity: 0.8;
      }
    </style>
  </head>

  <body class="bg-light">
    <div class="container mt-4">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4>Registro de Pago de Crédito</h4>
        </div>

        <div class="card-body">
          <form id="frmPagos">
            <div class="row">
              <div class="col-md-4 mb-3">
                <label>Fecha de Registro</label>
                <input type="text" id="fechaHora" name="fechaHora" class="form-control" readonly />
              </div>

              <div class="col-md-4 mb-3">
                <label>Tipo de Depósito</label>
                <select id="tipoDeposito" class="form-select" required>
                  <option value="">Seleccione</option>
                  <option value="BANORTE">BANORTE</option>
                  <option value="BANORTE-CEP">BANORTE-CEP</option>
                  <option value="TELECOMM">TELECOMM</option>
                  <option value="OXXO">OXXO</option>
                  <option value="BANSEFI">BANSEFI</option>
                </select>
              </div>

              <div class="col-md-4 mb-3">
                <label>Tel del Ejecutivo</label>
                <input type="text" id="telEjecutivo" class="form-control" />
              </div>

              <div class="col-md-4 mb-3">
                <label>Correo del ejecutivo</label>
                <input type="email" id="correoEjecutivo" class="form-control" />
              </div>

              <div class="col-md-4 mb-3">
                <label>Nombre del Ejecutivo</label>
                <input type="text" id="nombreEjecutivo" class="form-control" />
              </div>

              <div class="col-md-4 mb-3">
                <label>Nombre del Cliente</label>
                <input type="text" id="nombreCliente" class="form-control" required />
              </div>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label>Fecha Depósito</label>
                <input type="date" id="fechaDeposito" class="form-control" />
              </div>

              <div class="col-md-4 mb-3">
                <label>No. de Crédito</label>
                <input type="text" id="credito" class="form-control" />
              </div>

              <div class="col-md-4 mb-3">
                <label>Importe del Pago</label>
                <input type="number" step="0.01" id="importe" class="form-control" />
              </div>

              <div class="col-md-4 mb-3">
                <label>Producto</label>
                <select id="producto" class="form-select" required>
                  <option value="">Seleccione</option>
                  <option value="C-MOVIL">C-MOVIL</option>
                  <option value="C-FACIL">C-FACIL</option>
                  <option value="C-ESPCIAL">C-ESPECIAL</option>
                  <option value="C-EMPRENDEDOR">C-EMPRENDEDOR</option>
                  <option value="C-COSECHA">C-COSECHA</option>
                  <option value="C-AUTO">C-AUTO</option>
                  <option value="C-DISTRIBUIDOR">C-DISTRIBUIDOR</option>
                  <option value="CREDICONTADO">CREDICONTADO</option>
                  <option value="C-LIQUIDEZ">C-LIQUIDEZ</option>
                  <option value="C-PREFERENTE">C-PREFERENTE</option>
                </select>
              </div>

              <div id="divReferenciaPago" class="col-md-4 mb-3" style="display: none">
                <label>Referencia de Pago</label>
                <input type="text" id="referenciaPago" class="form-control" placeholder="Captura la referencia" />
              </div>

              <div id="divOficinaPago" class="col-md-4 mb-3" style="display: none">
                <label>Numero de Oficina</label>
                <input type="text" id="oficinaPago" class="form-control" placeholder="Captura el numero de oficina Bansefi" />
              </div>

              <div id="divFolioPago" class="col-md-4 mb-3" style="display: none">
                <label>Folio Pago Bansefi</label>
                <input type="text" id="folioPago" class="form-control" placeholder="Captura el folio de pago Bansefi" />
              </div>

              <div id="divChPago" class="col-md-4 mb-3" style="display: none">
                <label>Num. CH Bansefi</label>
                <input type="text" id="chPago" class="form-control" placeholder="Captura el num de CH Bansefi" />
              </div>

              <div class="col-md-4 mb-3">
                <label>Ficha de Depósito</label>
                <input type="file" id="fichaDeposito" class="form-control" accept=".pdf,.jpg,.jpeg,.png" required />
              </div>

              <div class="col-md-4 mb-3">
                <label>Captura de SAFI</label>
                <input type="file" id="capturaSafi" class="form-control" accept=".pdf,.jpg,.jpeg,.png" required />
              </div>

              <div class="col-md-4 mb-3">
                <label>Adjunta la D.O.R.</label>
                <input type="file" id="adjuntaDor" class="form-control" accept=".pdf,.jpg,.jpeg,.png" required />
              </div>

              <div class="col-md-4 mb-3">
                <label>Quin da el Vo.Bo.?</label>
                <input type="text" id="vistoBueno" class="form-control" placeholder="Quien da el visto bueno?" />
              </div>
            </div>

            <div class="mb-3">
              <label>Comentario</label>
              <textarea id="comentario" rows="4" class="form-control"></textarea>
            </div>

            <button type="submit" id="btnEnvio" class="btn btn-success">
              <span id="btnTexto">Registrar Pago</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
