<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <title>Reporte de Riesgos y Asistencia T.I.</title>

  <style>
    :root {
      --corporate-blue: #0f172a;
      --corporate-accent: #2563eb;
      --corporate-bg: #f8fafc;
      --card-border: #e2e8f0;
    }

    body {
      font-family: "Inter", sans-serif;
      background-color: var(--corporate-bg);
      color: #334155;
    }

    .header-card {
      background: linear-gradient(135deg, #0f172a 0%, #063f77 100%);
      color: #ffffff;
      border-radius: 12px;
      padding: 1.75rem 2rem;
      box-shadow:
        0 4px 6px -1px rgba(0, 0, 0, 0.1),
        0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .section-card {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      margin-bottom: 1.5rem;
      transition: all 0.2s ease;
    }

    .section-card:hover {
      box-shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.05);
    }

    .section-card .card-header-custom {
      background-color: #ffffff;
      border-bottom: 1px solid #f1f5f9;
      padding: 1rem 1.5rem;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-card .card-header-custom h5 {
      margin: 0;
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--corporate-blue);
    }

    .section-card .card-header-custom i {
      color: var(--corporate-accent);
      font-size: 1.1rem;
    }

    .section-card .card-body {
      padding: 1.5rem;
    }

    .form-label {
      font-weight: 500;
      font-size: 0.875rem;
      color: #475569;
      margin-bottom: 0.4rem;
    }

    .form-control,
    .form-select {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      font-size: 0.925rem;
      transition:
        border-color 0.15s ease-in-out,
        box-shadow 0.15s ease-in-out;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--corporate-accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .form-control[readonly] {
      background-color: #f1f5f9;
      color: #64748b;
    }

    .required-asterisk {
      color: #ef4444;
      margin-left: 2px;
    }

    .btn-corporate {
      background-color: var(--corporate-accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 2rem;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
      transition: all 0.2s ease;
    }

    .btn-corporate:hover:not(:disabled) {
      background-color: #1d4ed8;
      color: #ffffff;
      box-shadow: 0 4px 8px rgba(37, 99, 235, 0.3);
      transform: translateY(-1px);
    }

    #btnEnvio:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
  </style>
</head>

<body class="py-4 py-md-5">
  <div class="container" style="max-width: 960px">
    <!-- Encabezado Principal -->
    <div class="header-card mb-4 text-center text-md-start d-md-flex align-items-center justify-content-between">
      <div>
        <h3 class="mb-1 fw-bold"><i class="fa-solid fa-headset me-2"></i>Reporte de Riesgos</h3>
        <p class="mb-0 text-white-50 small">Soporte técnico, incidentes y requerimientos de sistemas</p>
      </div>
      <div class="mt-3 mt-md-0">
        <a href="../index.html" class="btn btn-outline-light btn-sm">
          <i class="fa-solid fa-arrow-left me-2"></i>Regresar al menú
        </a>
      </div>
    </div>

    <form id="frmSolicitudTI">
      <!-- SECCIÓN 1: Datos del Colaborador -->
      <div class="section-card">
        <div class="card-header-custom">
          <i class="fa-solid fa-user-tie"></i>
          <h5>1. Datos del Colaborador</h5>
        </div>
        <div class="card-body">
          <div class="row g-3">
            <!-- FECHA-HORA -->
            <div class="col-md-4">
              <label class="form-label" for="fechaHora">Fecha y Hora <span class="required-asterisk">*</span></label>
              <input type="text" id="fechaHora" name="fechaHora" class="form-control" required readonly />
            </div>

            <!-- NOMBRE COMPLETO -->
            <div class="col-md-4">
              <label class="form-label" for="nombreEjecutivo">Nombre Completo <span
                  class="required-asterisk">*</span></label>
              <input type="text" id="nombreEjecutivo" name="nombreEjecutivo" class="form-control"
                placeholder="Nombre completo" required />
            </div>

            <!-- PUESTO -->
            <div class="col-md-4">
              <label class="form-label" for="puestoEjecutivo">Puesto <span class="required-asterisk">*</span></label>
              <input type="text" id="puestoEjecutivo" name="puestoEjecutivo" class="form-control"
                placeholder="Puesto del colaborador" required />
            </div>

            <!-- SUCURSAL -->
            <div class="col-md-4">
              <label class="form-label" for="sucursal">Sucursal <span class="required-asterisk">*</span></label>
              <select id="sucursal" name="sucursal" class="form-select" required>
                <option value="">Seleccione la sucursal...</option>
                <option value="ACAYUCAN VERACRUZ">ACAYUCAN VERACRUZ</option>
                <option value="BOCA DEL RIO, VERACRUZ">BOCA DEL RIO, VERACRUZ</option>
                <option value="CANCUN QUINTANA ROO">CANCUN QUINTANA ROO</option>
                <option value="CIUDAD DE MEXICO">CIUDAD DE MEXICO</option>
                <option value="CUAUTLA, MORELOS">CUAUTLA, MORELOS</option>
                <option value="ESCARCEGA CAMPECHE">ESCARCEGA CAMPECHE</option>
                <option value="FELIPE CARRILLO PUERTO, QUINTANA ROO">FELIPE CARRILLO PUERTO, QUINTANA ROO</option>
                <option value="GUADALAJARA, JALISCO">GUADALAJARA, JALISCO</option>
                <option value="JUCHITAN DE ZARAGOZA, OAXACA">JUCHITAN DE ZARAGOZA, OAXACA</option>
                <option value="MANZANILLO COLIMA">MANZANILLO COLIMA</option>
                <option value="MERIDA, YUCATAN">MERIDA, YUCATAN</option>
                <option value="MORELIA, MICHOACAN">MORELIA, MICHOACAN</option>
                <option value="OAXACA, OAXACA">OAXACA, OAXACA</option>
                <option value="OCOSINGO CHIAPAS">OCOSINGO CHIAPAS</option>
                <option value="PALENQUE CHIAPAS">PALENQUE CHIAPAS</option>
                <option value="PARAISO TABASCO">PARAISO TABASCO</option>
                <option value="CIUDAD DEL CARMEN CAMPECHE">CIUDAD DEL CARMEN CAMPECHE</option>
                <option value="PLAYA DEL CARMEN QROO">PLAYA DEL CARMEN QROO</option>
                <option value="URUAPAN,MICHOACAN">URUAPAN, MICHOACAN</option>
                <option value="MENDIZABAL,PUEBLA">MENDIZABAL,PUEBLA</option>
                <option value="SAN FRANCISCO DE CAMPECHE,CAMPECHE">SAN FRANCISCO DE CAMPECHE,CAMPECHE</option>
                <option value="TICUL,YUCATAN">TICUL,YUCATAN</option>
                <option value="IZÚCAR DE MATAMOROS,PUEBLA">IZÚCAR DE MATAMOROS,PUEBLA</option>
                <option value="VILLA LÁZARO CÁRDENAS,PUEBLA">VILLA LÁZARO CÁRDENAS,PUEBLA</option>
                <option value="SAN JOSE CHILTEPEC,OAXACA">SAN JOSE CHILTEPEC, OAXACA</option>
                <option value="SANTO DOMINGO TEHUANTEPEC,OAXACA">SANTO DOMINGO TEHUANTEPEC,OAXACA</option>
                <option value="TAPACHULA CHIAPAS">TAPACHULA,CHIAPAS</option>
                <option value="TUXTLA GUTIERREZ,CHIAPAS">TUXTLA GUTIERREZ,CHIAPAS</option>
                <option value="COMITAN DE DOMINGUEZ,CHIAPAS">COMITAN DE DOMINGUEZ,CHIAPAS</option>
                <option value="TONALA,CHIAPAS">TONALA,CHIAPAS</option>
                <option value="OAXACA II">OAXACA II</option>
                <option value="PUERTO ESCONDIDO,OAXACA">PUERTO ESCONDIDO,OAXACA</option>
                <option value="VILLAHERMOSA,TABASCO">VILLAHERMOSA,TABASCO</option>
                <option value="AYUTLA DE LOS LIBRES,GUERRERO">AYUTLA DE LOS LIBRES, GUERRERO</option>
                <option value="TENOSIQUE,TABASCO">TENOSIQUE,TABASCO</option>
                <option value="JOSÉ MARÍA MORELOS,Q. ROO">JOSÉ MARÍA MORELOS,Q.ROO</option>
                <option value="CHILPANCINGO,GUERRERO">CHILPANCINGO,GUERRERO</option>
                <option value="MARIANO ESCOBEDO,VERACRUZ">MARIANO ESCOBEDO,VERACRUZ</option>
                <option value="MATIAS ROMERO,OAXACA">MATIAS ROMERO, OAXACA</option>
                <option value="ZIMATLAN DE ALVAREZ,OAXACA">ZIMATLAN DE ALVAREZ,OAXACA</option>
                <option value="HUIMANGUILLO,TABASCO">HUIMANGUILLO,TABASCO</option>
                <option value="MACUSPANA,TABASCO">MACUSPANA, TABASCO</option>
                <option value="NUEVA PALESTINA,CHIAPAS">NUEVA PALESTINA,CHIAPAS</option>
                <option value="TAPILULA,CHIAPAS">TAPILULA,CHIAPAS</option>
              </select>
            </div>

            <!-- TELEFONO -->
            <div class="col-md-4">
              <label class="form-label" for="telefonoEjecutivo">Teléfono <span
                  class="required-asterisk">*</span></label>
              <input type="text" id="telefonoEjecutivo" name="telefonoEjecutivo" class="form-control"
                placeholder="Ej. 5512345678" inputmode="numeric" pattern="[0-9]*"
                oninput="this.value = this.value.replace(/[^0-9]/g, '')" required />
            </div>

            <!-- CORREO -->
            <div class="col-md-4">
              <label class="form-label" for="correoEjecutivo">Correo Electrónico <span
                  class="required-asterisk">*</span></label>
              <input type="email" id="correoEjecutivo" name="correoEjecutivo" class="form-control"
                placeholder="ejemplo@empresa.com" required />
            </div>
          </div>
        </div>
      </div>

      <!-- SECCIÓN 2: Detalles del Reporte (Dinámica) -->
      <div class="section-card">
        <div class="card-header-custom">
          <i class="fa-solid fa-shield-halved"></i>
          <h5>2. Detalles del Reporte</h5>
        </div>
        <div class="card-body">
          <div class="row g-3">
            <!-- TIPO DE REPORTE -->
            <div class="col-md-12">
              <label class="form-label" for="tipoReporte">Tipo de Reporte <span
                  class="required-asterisk">*</span></label>
              <select id="tipoReporte" name="tipoReporte" class="form-select" required>
                <option value="">Seleccione el tipo de reporte...</option>
                <option value="Incidencia de Seguridad">Incidencia de Seguridad</option>
                <option value="Falsificación de Documentos">Falsificación de Documentos</option>
                <option value="Otros">Otros</option>
              </select>
            </div>

            <!-- ===== BLOQUE 1: INCIDENCIA DE SEGURIDAD ===== -->
            <div id="bloqueIncidencia" class="col-12 d-none">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="tipoIncidencia">Tipo de Incidencia <span
                      class="required-asterisk">*</span></label>
                  <input type="text" id="tipoIncidencia" name="tipoIncidencia" class="form-control"
                    placeholder="Ej. Acceso no autorizado, malware..." />
                </div>

                <div class="col-md-3">
                  <label class="form-label" for="fechaEvento">Fecha del Evento <span
                      class="required-asterisk">*</span></label>
                  <input type="date" id="fechaEvento" name="fechaEvento" class="form-control" />
                </div>

                <div class="col-md-3">
                  <label class="form-label" for="horaAproximada">Hora Aproximada <span
                      class="required-asterisk">*</span></label>
                  <input type="time" id="horaAproximada" name="horaAproximada" class="form-control" />
                </div>

                <div class="col-md-12">
                  <label class="form-label" for="jefeInformado">Jefe Informado <span
                      class="required-asterisk">*</span></label>
                  <select id="jefeInformado" name="jefeInformado" class="form-select">
                    <option value="">Seleccione...</option>
                    <option value="SI">Sí</option>
                    <option value="NO">No</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- ===== BLOQUE 2: FALSIFICACIÓN DE DOCUMENTOS ===== -->
            <div id="bloqueFalsificacion" class="col-12 d-none">
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label" for="folioPlataforma">Folio Plataforma <span
                      class="required-asterisk">*</span></label>
                  <input type="text" id="folioPlataforma" name="folioPlataforma" class="form-control"
                    placeholder="Número o clave de folio" />
                </div>

                <div class="col-md-4">
                  <label class="form-label" for="plataforma">Plataforma <span class="required-asterisk">*</span></label>
                  <input type="text" id="plataforma" name="plataforma" class="form-control"
                    placeholder="Ej. Sistema Core, App Movil..." />
                </div>

                <div class="col-md-4">
                  <label class="form-label" for="cliente">Cliente <span class="required-asterisk">*</span></label>
                  <input type="text" id="cliente" name="cliente" class="form-control"
                    placeholder="Nombre completo del cliente" />
                </div>

                <div class="col-md-6">
                  <label class="form-label" for="documentoReportado">Documento Reportado <span
                      class="required-asterisk">*</span></label>
                  <input type="text" id="documentoReportado" name="documentoReportado" class="form-control"
                    placeholder="Ej. INE, Comprobante de domicilio..." />
                </div>

                <div class="col-md-6">
                  <label class="form-label" for="deteccion">Detección <span class="required-asterisk">*</span></label>
                  <input type="text" id="deteccion" name="deteccion" class="form-control"
                    placeholder="¿Cómo se detectó la falsificación?" />
                </div>
              </div>
            </div>

            <!-- ===== BLOQUE 3: OTROS ===== -->
            <div id="bloqueOtros" class="col-12 d-none">
              <div class="row g-3">
                <div class="col-md-12">
                  <label class="form-label" for="tipoRiesgo">Tipo de Riesgo <span
                      class="required-asterisk">*</span></label>
                  <input type="text" id="tipoRiesgo" name="tipoRiesgo" class="form-control"
                    placeholder="Especifique el tipo de riesgo" />
                </div>
              </div>
            </div>

            <!-- DESCRIPCIÓN (Común para todos los tipos de reporte) -->
            <div id="bloqueDescripcion" class="col-md-12 d-none">
              <label class="form-label" for="descripcion">Descripción detallada de lo reportado <span
                  class="required-asterisk">*</span></label>
              <textarea id="descripcion" name="descripcion" rows="4" class="form-control"
                placeholder="Escriba aquí los detalles..."></textarea>
            </div>
          </div>
        </div>
      </div>

      <!-- SECCIÓN 3: Evidencia Adjunta -->
      <div class="section-card">
        <div class="card-header-custom">
          <i class="fa-solid fa-paperclip"></i>
          <h5>3. Evidencia Adjunta</h5>
        </div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-12">
              <label class="form-label" for="evidencia">Evidencia (Imagen o PDF)</label>
              <input type="file" id="evidencia" name="evidencia" class="form-control"
                accept=".pdf,image/png,image/jpeg,image/jpg" />
              <div class="form-text">Puede adjuntar captura de pantalla, foto del error o documento aclaratorio (PDF,
                JPG, PNG).</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Botón de Envío -->
      <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
        <button type="submit" id="btnEnvio" class="btn btn-corporate px-5 py-2 fs-6">
          <span id="btnTexto"><i class="fa-solid fa-paper-plane me-2"></i>Enviar Solicitud</span>
          <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"
            aria-hidden="true"></span>
        </button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>

</html>
