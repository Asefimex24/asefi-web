<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Guardavalores</title>
  </head>

  <body class="bg-light">
    <div class="container mt-4">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4>Solicitud de Documento (Guardavalores)</h4>
        </div>

        <div class="card-body">
          <form id="frmGuardavalores">
            <div class="row">
              <div class="col-md-4 mb-3">
                <label>Fecha de Solicitud</label>
                <input type="text" id="fechaHora" name="fechaHora" class="form-control" readonly />
              </div>

              <div class="col-md-4 mb-3">
                <label>Tel del Ejecutivo</label>
                <input type="text" id="telEjecutivo" class="form-control" />
              </div>

              <!-- id-nombreEjecutivo -->
              <div class="col-md-4 mb-3">
                <label>Nombre del Ejecutivo</label>
                <input type="text" id="nombreEjecutivo" class="form-control" required />
              </div>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label>Correo del ejecutivo</label>
                <input type="email" id="correoEjecutivo" class="form-control" />
              </div>

              <div class="col-md-3 mb-3">
                <label>Sucursal</label>
                <select id="sucursal" class="form-select" required>
                  <option value="">Seleccione la sucursal</option>
                  <option value="TUXTLA GUTIERREZ">TUXTLA GUTIERREZ</option>
                  <option value="TONALA">TONALA</option>
                  <option value="TAPILULA">TAPILULA</option>
                  <option value="VERACRUZ">VERACRUZ</option>
                  <option value="NUEVA PALESTINA">NUEVA PALESTINA</option>
                </select>
              </div>

              <div class="col-md-3 mb-3">
                <label>Nombre del cliente</label>
                <input type="text" id="nombreCliente" class="form-control" />
              </div>

              <div class="col-md-2 mb-3">
                <label>No. de Crédito</label>
                <input type="text" id="credito" class="form-control" />
              </div>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label>Tipo Documento</label>
                <select id="tipoDocumento" class="form-select" required>
                  <option value="">Seleccione</option>
                  <option value="Acta de Supervisión">Acta de Supervisión</option>
                  <option value="Autorización de Entrega Unidad">Autorización de Entrega Unidad</option>
                  <option value="Carátula de comité">Carátula de comité</option>
                  <option value="Carátula de contrato">Carátula de contrato</option>
                  <option value="Carátula de crédito">Carátula de crédito</option>
                  <option value="Carta de factura">Carta de factura</option>
                  <option value="Comprobante de Domicilio">Comprobante de Domicilio</option>
                  <option value="Factura sin valor">Factura sin valor</option>
                  <option value="Garantía adicional">Garantía adicional</option>
                  <option value="Ine Cliente">Ine Cliente</option>
                  <option value="Otros">Otros</option>
                  <option value="Pagaré">Pagaré</option>
                  <option value="Permiso de Circulación">Permiso de Circulacion</option>
                  <option value="Presentacion de Crédito">Presentacion de credito</option>
                  <option value="Reporte Fotográfico">Reporte Fotográfico</option>
                  <option value="Solicitud de Crédito">Solicitud de Credito</option>
                  <option value="Tabla de amortización">Tabla de amortización</option>
                  <option value="Visita domiciliar">Visita domiciliar</option>
                </select>
              </div>

              <div class="col-md-3 mb-3">
                <label>Motivo de la Solicitud</label>
                <input type="text" id="motivo" class="form-control" />
              </div>
            </div>
            <button type="submit" id="btnSolicitar" class="btn btn-success">
              <span id="btnTexto">Solicitar</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
